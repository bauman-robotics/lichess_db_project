<div class="d-flex gap-2 justify-content-center flex-wrap viewer-nav-buttons">
    <button id="viewFlip"  class="btn btn-sm btn-secondary" title="Повернуть">🔄</button>
    <button id="viewFirst" class="btn btn-sm btn-secondary" title="В начало">⏮</button>
    <button id="viewPlay"  class="btn btn-sm btn-primary" title="Играть / Пауза">⏯</button>
    <button id="viewLast"  class="btn btn-sm btn-secondary" title="В конец">⏭</button>
    <button id="viewPrev"  class="btn btn-sm btn-secondary" title="Назад">◀</button>
    <button id="viewNext"  class="btn btn-sm btn-secondary" title="Вперёд">▶</button>
</div>

<div class="mt-2 text-center viewer-move-counter">
    <small class="text-muted">
        Ход <span id="viewMoveCounter">0</span> из <span id="viewMoveTotal">0</span>
    </small>
    <br>
    <small class="text-muted viewer-keyboard-hint">
        ← → перемотка, Space — play/pause
    </small>
</div>

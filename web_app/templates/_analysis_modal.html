<div class="modal fade" id="analysisModal" tabindex="-1" aria-labelledby="analysisModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="analysisModalLabel">
                    🤖 Анализ партии <span id="analysis-game-id"></span>
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <div class="modal-body">

                <!-- Метаданные -->
                <div id="analysis-meta" class="mb-3">
                    <div class="row">
                        <div class="col-md-6">
                            <small class="text-muted">Дата</small>
                            <div id="meta-date">—</div>
                        </div>
                        <div class="col-md-6">
                            <small class="text-muted">Результат</small>
                            <div id="meta-result">—</div>
                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-md-6">
                            <small class="text-muted">Соперник</small>
                            <div id="meta-opponent">—</div>
                        </div>
                        <div class="col-md-6">
                            <small class="text-muted">Дебют</small>
                            <div id="meta-opening">—</div>
                        </div>
                    </div>
                </div>

                <!-- Вариант промпта и повторный анализ -->
                <div class="analysis-prompt-bar mb-3">
                    <div class="small text-muted mb-2">Вариант разбора:</div>
                    <div class="analysis-prompt-buttons" id="analysisPromptButtons">
                        {% for key, label in prompt_variants.items() %}
                            <button type="button"
                                    class="analysis-prompt-btn{% if loop.first %} active{% endif %}"
                                    data-prompt-key="{{ key }}">
                                {{ label }}
                            </button>
                        {% endfor %}
                    </div>
                    <button type="button" class="btn btn-sm btn-primary mt-2" id="analysisRerunBtn">
                        🔄 Повторить анализ
                    </button>
                </div>

                <!-- Краткая нотация -->
                <details class="mb-3">
                    <summary class="text-muted" style="cursor: pointer;">
                        📋 Краткая нотация
                    </summary>
                    <pre id="analysis-pgn" class="mt-2 p-2"
                         style="background: rgba(255,255,255,0.03); border-radius: 6px;
                                max-height: 200px; overflow-y: auto;
                                white-space: pre-wrap; font-size: 12px;">—</pre>
                </details>

                <!-- Блок ответа -->
                <div id="analysis-status" class="text-center py-3 d-none">
                    <div class="spinner-border text-warning" role="status"></div>
                    <p class="mt-2 mb-0 text-muted">DeepSeek думает…</p>
                </div>

                <div id="analysis-error" class="alert alert-danger d-none"></div>

                <!-- Ссылка «Смотреть партию» -->
                <div class="mb-3">
                    <a href="#"
                       id="viewFromAnalysisLink"
                       class="btn btn-sm btn-primary"
                       target="_blank"
                       rel="noopener">
                        👁 Смотреть партию
                    </a>
                </div>

                <div id="analysis-content" class="markdown-body"></div>

            </div>
        </div>
    </div>
</div>

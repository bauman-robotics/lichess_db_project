# Общие настройки приложения
app:
  name: "Lichess DB Manager"
  version: "1.0.0"
  description: "Управление базой данных шахматных партий с Lichess"
  environment: "development"  # development, staging, production
  log_level: "INFO"
  data_dir: "data"

# Настройки базы данных
database:
  db_name: "lichess_games"
  pool_size: 5
  timeout: 30
  encoding: "UTF8"
  connection_retries: 3
  retry_delay: 2

# Настройки SSH (для удаленного подключения)
ssh:
  default_username: "ubuntu"
  default_port: 22
  connection_timeout: 10
  key_type: "rsa"

# Настройки импорта
import:
  default_mode: "file"  # file или api
  
  file:
    default_path: "data/uploads/games.pgn"
    supported_formats: [".pgn", ".PGN"]
    encoding: "utf-8"
    chunk_size: 100
    delete_after_import: false
    
  api:
    base_url: "https://lichess.org/api"
    download_limit: 1000
    max_retries: 3
    retry_delay: 2
    export_format: "pgn"
    timeout: 60
    params:
      max: 1000
      since: null
      until: null
      perfType: null
      moves: true
      tags: true
      clocks: true
      evals: true
      accuracy: true

# Настройки для статистики
statistics:
  cache_enabled: true
  cache_ttl: 3600  # секунды
  default_limit: 100
  recent_games_limit: 30   # ← сколько последних игр показывать

# Настройки валидации
validation:
  strict_mode: true
  skip_invalid: false
  required_fields:
    - game_date
    - player_color
    - result
    - opponent_name
    - my_rating
    - opponent_rating

# Настройки DeepSeek
deepseek:
  # Режим: bridge (Post-Bridge, бесплатно) | api (официальный DeepSeek) | disabled
  mode: "api"

  # Общие настройки (fallback)
  system_prompt: "Ты полезный помощник. Отвечай на русском языке."
  temperature: 0.7
  timeout: 90

  # Промпт из config/deepseek_prompts.yaml
  # Какой промпт использовать для анализа партий.
  # Доступные варианты — ключи из config/deepseek_prompts.yaml
  # Примеры: game_analysis, game_analysis_sarcastic
  prompt_key: "game_analysis_sarcastic"

  # Post-Bridge (обёртка над chat.deepseek.com)
  bridge:
    url: "http://localhost:8001/v1/chat/completions"
    healthz: "http://localhost:8001/v1/models"
    model: "deepseek-chat"
    max_tokens: 2000
    thinking_disabled: false      # не применимо, но пусть будет

  # Официальный DeepSeek API
  api:
    url: "https://api.deepseek.com/v1/chat/completions"
    healthz: "https://api.deepseek.com/v1/models"
    model: "deepseek-flash"       # или deepseek-v4-pro
    max_tokens: 4000
    thinking_disabled: true       # ← отключает reasoning



viewer:
  board_size_desktop: 900   # px
  board_size_mobile: 320    # px
  play_interval_ms: 800     # мс между ходами в автопрокрутке
  default_flipped: false    # или true для игры за чёрных
  default_tab: comments     # 'moves' или 'comments' — какая вкладка открывается первой на мобильном
  show_coords: true         # ← показывать координаты клеток a-h, 1-8